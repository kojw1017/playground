version: '3.8'

services:
  # ==========================================
  # [DB Zone] MySQL + Adminer
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: local-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: playground
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer: # MySQL 가볍게 확인하는 툴
    image: adminer
    container_name: local-adminer
    ports:
      - "8090:8080" # localhost:8090 접속

  # ==========================================
  # [Cache Zone] Redis + RedisInsight
  # ==========================================
  redis:
    image: redis:alpine
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-insight: # Redis GUI (강추)
    image: redis/redisinsight:latest
    container_name: local-redis-insight
    ports:
      - "5540:5540" # localhost:5540 접속
    volumes:
      - redis_insight_data:/data

  # ==========================================
  # [Messaging Zone] Kafka + Zookeeper + UI
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: local-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: local-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui: # Kafka 최고 존엄 GUI
    image: provectuslabs/kafka-ui:latest
    container_name: local-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080" # localhost:8085 접속
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ==========================================
  # [Observability Zone] Prom + Grafana + Jaeger
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: local-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=3d"

  grafana:
    image: grafana/grafana:latest
    container_name: local-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: local-jaeger
    ports:
      - "16686:16686" # UI 접속 포트
      - "4317:4317"
      - "4318:4318"

volumes:
  mysql_data:
  redis_data:
  redis_insight_data:
  kafka_data:
  prometheus_data:
  grafana_data: